{
  "version": 1,
  "execution": {
    "mode": "dry-run",
    "production_revocation_enabled": false,
    "max_event_age_seconds": 300,
    "max_future_skew_seconds": 60
  },
  "routes": {
    "default": {
      "decision": "immediate-credential-revocation-and-incident-escalation",
      "severity": "critical",
      "actions": [
        "revoke_credential_immediately",
        "escalate_security_incident",
        "rotate_dependent_credentials",
        "review_exposure_history"
      ]
    },
    "generic": {
      "decision": "validate-before-revocation",
      "severity": "high",
      "actions": [
        "validate_secret_safely",
        "revoke_if_confirmed",
        "escalate_if_confirmed"
      ]
    },
    "ai-detected": {
      "decision": "human-validation-before-revocation",
      "severity": "high",
      "actions": [
        "validate_ai_detected_finding",
        "revoke_if_confirmed",
        "escalate_if_confirmed"
      ]
    },
    "false-positive": {
      "decision": "no-action-false-positive",
      "severity": "informational",
      "actions": []
    },
    "unknown": {
      "decision": "quarantine-and-manual-triage",
      "severity": "high",
      "actions": [
        "validate_secret_safely",
        "identify_provider_owner",
        "escalate_if_confirmed"
      ]
    }
  },
  "secret_types": {
    "resend_api_key": {
      "provider": "resend",
      "category": "default"
    },
    "apiclub_api_key": {
      "provider": "apiclub",
      "category": "default"
    },
    "volcengine_ark_api_key": {
      "provider": "volcengine-ark",
      "category": "default"
    },
    "password": {
      "provider": "generic",
      "category": "generic",
      "detection": "ai-detected"
    }
  },
  "generic_secret_types": [
    "ec_private_key",
    "generic_private_key",
    "http_basic_authentication_header",
    "http_bearer_authentication_header",
    "mongodb_connection_string",
    "mysql_connection_url",
    "openssh_private_key",
    "password",
    "pgp_private_key",
    "postgres_connection_string",
    "rsa_private_key"
  ]
}
