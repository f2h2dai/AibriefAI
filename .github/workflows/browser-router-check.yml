name: Browser Router Checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/browser-router-check.yml"
      - "aibrief/connectors/browser_router.py"
      - "aibrief/capability_catalog.json"
      - "config/browser_router.json"
      - "config/agent_limits.yaml"
      - "scripts/check_lightpanda.py"
      - "scripts/install_lightpanda.py"
      - "scripts/smoke_lightpanda.py"
      - "skills/lightpanda/**"
      - "tests/test_browser_router.py"
      - "tests/test_capability_registry.py"
      - "tests/test_install_lightpanda.py"
      - "docs/lightpanda-web-execution.md"
  pull_request:
    paths:
      - ".github/workflows/browser-router-check.yml"
      - "aibrief/connectors/browser_router.py"
      - "aibrief/capability_catalog.json"
      - "config/browser_router.json"
      - "config/agent_limits.yaml"
      - "scripts/check_lightpanda.py"
      - "scripts/install_lightpanda.py"
      - "scripts/smoke_lightpanda.py"
      - "skills/lightpanda/**"
      - "tests/test_browser_router.py"
      - "tests/test_capability_registry.py"
      - "tests/test_install_lightpanda.py"
      - "docs/lightpanda-web-execution.md"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AGENT_LIMIT_ID: agent_quality_gates
  LIGHTPANDA_VERSION: "0.3.6"

jobs:
  browser-router:
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Agent limit preflight
        run: python3 scripts/check_agent_limits.py --agent "$AGENT_LIMIT_ID" --all-workflows

      - name: Cache Lightpanda
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/lightpanda/0.3.6
          key: lightpanda-${{ runner.os }}-${{ runner.arch }}-0.3.6

      - name: Install verified Lightpanda
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/install_lightpanda.py \
            --version "$LIGHTPANDA_VERSION" \
            --destination "$RUNNER_TEMP/lightpanda/$LIGHTPANDA_VERSION/lightpanda" \
            --github-env "$GITHUB_ENV"

      - name: Validate browser policy and readiness
        run: python3 scripts/check_lightpanda.py --require-binary

      - name: Run live Lightpanda smoke test
        run: python3 scripts/smoke_lightpanda.py

      - name: Run browser router tests
        run: |
          python3 -m unittest \
            tests.test_browser_router \
            tests.test_capability_registry \
            tests.test_install_lightpanda \
            -v
