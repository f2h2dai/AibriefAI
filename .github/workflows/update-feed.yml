                  stars = repo.get("stargazers_count")
                  updated = repo.get("pushed_at") or repo.get("updated_at")
                  details = [
                      repo.get("description") or curated["description"],
                      "Tracks free LLM API providers, SDK compatibility, and rate limits for builders.",
