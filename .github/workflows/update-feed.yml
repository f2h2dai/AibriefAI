          report = {
              "project": "AIbrief",
              "generated_at": NOW,
              "signals": len(signals),
              "approved": approved,
              "held": held,
              "errors": len([e for e in PIPELINE_EVENTS if e["level"] == "error"]),
              "mode": run_mode,
              "model": run_model,
              "provider_counts": PROVIDER_COUNTS,
              **freshness_metadata,
              "events": PIPELINE_EVENTS[-20:],
              **notification_metadata,
          }

          health = {
              "status": "ok",
              "generated_at": NOW,
              "signals": len(signals),
              "approved": approved,
              "mode": run_mode,
              "model": run_model,
              "provider_counts": PROVIDER_COUNTS,
