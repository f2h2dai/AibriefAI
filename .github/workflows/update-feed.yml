                  "freshnessAgeDays": age,
                  "createdAt": NOW,
                  "updatedAt": NOW,
              })

          visible_signals = [s for s in signals if s["freshnessStatus"] != "stale"]
          if len(visible_signals) >= 6:
              signals = visible_signals

          signals = sorted(
              signals,
              key=lambda x: (freshness_rank(x), x["score"]),
              reverse=True,
          )[:12]
          source_failures_by_agent = {}
          for event in PIPELINE_EVENTS:
              if event.get("level") != "error":
                  continue
              source_name = event.get("agent", "unknown")
              source_failures_by_agent.setdefault(
                  source_name,
                  {
                      "source": source_name,
                      "reason": event.get("message", "source or provider failure"),
                  },
              )
          source_failures = list(source_failures_by_agent.values())
          operations_result = AgentOperationsOrchestrator().process_existing_run(
              signals,
              mode="global_ai",
              configured_threshold=ACTION_SCORE_THRESHOLD,
              generated_at=NOW,
              provider_counts=PROVIDER_COUNTS,
              events=PIPELINE_EVENTS,
              runtime_seconds=time.monotonic() - PIPELINE_STARTED,
              source_failures=source_failures,
          )
          signals = operations_result["signals"]
          fresh_signals = [
              signal
              for signal in signals
              if signal_key(signal) not in PREVIOUS_SIGNAL_KEYS
          ]
          approved = sum(1 for s in signals if s["status"] == "verified")
          held = len(signals) - approved
          freshness_counts = {}
          for signal in signals:
              status = signal.get("freshnessStatus", "unknown")
              freshness_counts[status] = freshness_counts.get(status, 0) + 1
          ages = [
              signal["freshnessAgeDays"]
              for signal in signals
              if isinstance(signal.get("freshnessAgeDays"), (int, float))
          ]
          freshness_metadata = {
              "freshness_counts": freshness_counts,
              "max_source_age_days": max(ages) if ages else None,
              "fresh_source_days": FRESH_SOURCE_DAYS,
              "stale_source_days": STALE_SOURCE_DAYS,
          }

          notification_enabled, notification_reason = should_send_notification()
          notification_sent = False

          if notification_enabled:
              notification_sent, notification_reason = send_ntfy_digest(signals, fresh_signals)

          notification_metadata = {
