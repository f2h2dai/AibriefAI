                      "url": repo.get("html_url") or curated["html_url"],
                      "collector": "GitHubAgent",
                      "source_published_at": updated,
                  })

              recent_cutoff = (NOW_DT - timedelta(days=14)).strftime("%Y-%m-%d")
              q = urllib.parse.quote(f"AI agents language:Python pushed:>={recent_cutoff}")
              repos = fetch_json(
                  f"https://api.github.com/search/repositories?q={q}&sort=updated&order=desc&per_page=10"
              )

              for repo in repos.get("items", [])[:8]:
                  if str(repo.get("full_name") or "").lower() in curated_names:
                      continue
                  items.append({
                      "source": "github",
                      "title": repo.get("full_name") or repo.get("name") or "GitHub repository",
                      "content": repo.get("description") or "No description.",
                      "url": repo.get("html_url") or "https://github.com",
                      "collector": "GitHubAgent",
                      "source_published_at": repo.get("pushed_at") or repo.get("updated_at"),
                  })
          except Exception as e:
              log_event("error", "GitHubAgent", e)

          try:
              q = urllib.parse.quote('all:"AI agents" OR all:"large language model" OR all:"autonomous systems"')
              xml = fetch_text(
                  f"https://export.arxiv.org/api/query?search_query={q}&start=0&max_results=8&sortBy=submittedDate&sortOrder=descending"
              )

              root = ET.fromstring(xml)
              ns = {"a": "http://www.w3.org/2005/Atom"}

              for entry in root.findall("a:entry", ns):
                  title = " ".join((entry.findtext("a:title", default="", namespaces=ns) or "").split())
                  summary = " ".join((entry.findtext("a:summary", default="", namespaces=ns) or "").split())
                  link = entry.findtext("a:id", default="https://arxiv.org", namespaces=ns)

                  if link.startswith("http://"):
                      link = "https://" + link[len("http://"):]

                  items.append({
                      "source": "arxiv",
                      "title": title,
                      "content": summary,
                      "url": link,
                      "collector": "AcademicAgent",
                      "source_published_at": entry.findtext("a:published", default="", namespaces=ns)
                      or entry.findtext("a:updated", default="", namespaces=ns),
                  })
          except Exception as e:
              log_event("error", "AcademicAgent", e)

          log_agent_reach_doctor()

          try:
              x_items = fetch_x_influencers_cli(limit=20)
              items += x_items

              if x_items:
                  log_event("info", "XInfluencerAgent", f"Collected {len(x_items)} X influencer signals.")
              else:
                  log_event("warning", "XInfluencerAgent", "X influencer search returned zero items. Configure X access and influencer handles.")
          except Exception as e:
              log_event("warning", "XInfluencerAgent", f"X influencer search failed before collection: {type(e).__name__}: {safe_log_text(e)}")

          try:
              from aibrief.connectors.agent_reach import fetch_reddit_deep, fetch_youtube

              agent_reach_items = []
              agent_reach_items.extend(fetch_youtube() or [])
              agent_reach_items.extend(
                  fetch_reddit_deep(["LocalLLaMA", "MachineLearning", "OpenAI", "singularity"], limit=10) or []
              )

              if agent_reach_items:
                  items.extend(agent_reach_items)
              else:
                  log_event("warning", "AgentReachConnector", "Agent-Reach returned no optional social results.")
          except Exception as e:
              log_event("warning", "AgentReachConnector", f"Agent-Reach unavailable: {type(e).__name__}: {e}")

          if not items:
              items = [
                  {
                      "source": "fallback",
                      "title": "AIbrief command pipeline is live",
                      "content": "The scheduled GitHub Actions pipeline generated a fallback briefing because upstream sources were unavailable.",
                      "url": "https://github.com",
                      "collector": "RaindropTriageAgent",
                  }
              ]

          seen = set()
          signals = []

          for raw in items:
              if raw.get("source") == "twitter":
                  published_dt = source_published_timestamp(raw)
                  if not published_dt:
                      log_event("warning", "XInfluencerAgent", "Rejected X post without a trustworthy source timestamp.")
                      continue
                  age = NOW_DT - published_dt
                  if not timedelta(minutes=-10) <= age <= timedelta(days=X_MAX_SOURCE_AGE_DAYS):
                      log_event("info", "XInfluencerAgent", "Rejected stale X post before ranking.")
                      continue
                  raw["source_published_at"] = isoformat_dt(published_dt)

              key = (raw["source"], raw["title"].lower().strip())

              if key in seen:
                  continue

              seen.add(key)

              source_published_at = source_timestamp(raw)
              base_score = score_text(raw["title"], raw["content"], raw["source"])
              freshness_delta = freshness_adjustment(source_published_at, raw["source"])
              score = max(0, min(100, base_score + freshness_delta))
              score_note = (
                  score_reason(raw["title"], raw["content"], raw["source"], score)
                  + f" Freshness: {freshness_reason(source_published_at)}."
              )
              en, ar, provider = llm_brief(raw["title"], raw["content"])
              age = source_age_days(source_published_at)

              signals.append({
                  "id": f"{raw['source']}-{len(signals)+1:03d}",
