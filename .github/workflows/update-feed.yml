                border-left-color: #ffd166;
                border-radius: 999px;
                content: "";
                inset: 4px;
                position: absolute;
                transform: rotate(-18deg);
              }}

              .hero-mark::after {{
                background: linear-gradient(135deg, #ffd166, #ff8f3f);
                border: 2px solid #fff;
                border-radius: 999px;
                content: "";
                height: 11px;
                position: absolute;
                right: -2px;
                top: 8px;
                width: 11px;
              }}

              .hero-mark span {{
                align-items: center;
                background: #fff;
                border-radius: 999px;
                color: #083d5f;
                display: flex;
                font-size: 12px;
                font-weight: 900;
                height: 22px;
                justify-content: center;
                line-height: 1;
                position: relative;
                width: 22px;
                z-index: 2;
              }}

              h1 {{
                font-size: clamp(42px, 8vw, 86px);
                line-height: .9;
                margin: 18px 0;
                letter-spacing: -0.07em;
              }}

              .sub {{
                color: #d4d4d4;
                font-size: 18px;
                max-width: 880px;
                line-height: 1.6;
              }}

              .command-grid {{
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                gap: 12px;
                margin-top: 22px;
              }}

              .command-card {{
                border: 1px solid var(--border);
                border-radius: 18px;
                padding: 15px;
                background: rgba(255,255,255,0.045);
              }}

              .command-card.degraded {{
                border-color: #ef4444;
                background: rgba(239,68,68,0.14);
              }}

              .command-card.degraded .meta,
              .command-card.degraded strong {{
                color: #fecaca;
              }}

              .command-card strong {{
                display: block;
                margin-top: 6px;
                font-size: 17px;
              }}

              .toolbar {{
                display: grid;
                grid-template-columns: 1fr auto auto;
                gap: 14px;
                margin-top: 26px;
              }}

              .field {{
                display: flex;
                flex-direction: column;
                gap: 6px;
              }}

              .field label {{
                color: var(--muted);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: .08em;
              }}

              input,
              select,
              button {{
                border: 1px solid var(--border);
                background: rgba(255,255,255,0.045);
                color: var(--text);
                border-radius: 14px;
                padding: 12px 14px;
                font-size: 14px;
              }}

              input {{
                width: 100%;
              }}

              button {{
                cursor: pointer;
              }}

              button:hover {{
                background: rgba(255,255,255,0.09);
              }}

              .source-tabs,
              .topic-pills {{
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 16px;
              }}

              .tab.active,
              .pill.active {{
                background: var(--indigo);
                border-color: var(--indigo);
                color: #fff;
              }}

              .tab:disabled {{
                cursor: not-allowed;
                opacity: 0.55;
              }}

              .agent-reach-note {{
                color: var(--muted);
                font-size: 13px;
                line-height: 1.5;
                margin: 12px 0 0;
              }}

              .status-row {{
                display: flex;
                justify-content: space-between;
                gap: 14px;
                align-items: center;
                color: var(--muted);
                margin: 22px 2px 0;
                flex-wrap: wrap;
              }}

              .layout {{
                display: grid;
                grid-template-columns: minmax(0, 1fr) 330px;
                gap: 18px;
                margin-top: 22px;
              }}

              .grid {{
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
                gap: 18px;
              }}

              .card,
              .side-panel {{
                border: 1px solid var(--border);
                border-radius: 24px;
                background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.025));
              }}

              .card {{
                padding: 22px;
                min-height: 320px;
                display: flex;
                flex-direction: column;
                gap: 12px;
              }}

              .card h2 {{
                font-size: 20px;
                line-height: 1.2;
                margin: 0;
                letter-spacing: -0.03em;
              }}

              .card p {{
                color: #d0d0d0;
                line-height: 1.65;
                margin: 0;
              }}

              .score-reason {{
                border-left: 3px solid var(--indigo);
                padding-left: 10px;
                color: #cfcfcf;
                font-size: 13px;
                line-height: 1.5;
              }}

              .card-footer {{
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                margin-top: auto;
              }}

              .badge {{
                display: inline-flex;
                align-items: center;
                border-radius: 999px;
                padding: 6px 10px;
                font-size: 12px;
                font-weight: 700;
                color: #050505;
              }}

              .copy {{
                padding: 8px 10px;
                border-radius: 999px;
                font-size: 12px;
              }}

              a {{
                color: #fff;
                text-decoration-color: rgba(255,255,255,0.35);
              }}

              .empty {{
                border: 1px dashed var(--border);
                border-radius: 22px;
                padding: 32px;
                color: var(--muted);
                grid-column: 1 / -1;
                text-align: center;
              }}

              .side-panel {{
                padding: 18px;
                height: fit-content;
                position: sticky;
                top: 20px;
              }}

              .agent {{
                display: flex;
                justify-content: space-between;
                gap: 12px;
                border-bottom: 1px solid var(--border);
                padding: 12px 0;
              }}

              .agent:last-child {{
                border-bottom: 0;
              }}

              .agent small {{
                color: var(--muted);
                display: block;
                margin-top: 4px;
              }}

              .status-dot {{
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: #10b981;
                margin-top: 4px;
                flex: 0 0 auto;
              }}

              @media (max-width: 900px) {{
                .layout {{
                  grid-template-columns: 1fr;
                }}

                .side-panel {{
                  position: static;
                }}
              }}

              @media (max-width: 760px) {{
                main {{
                  padding-top: 18px;
                }}

                .hero {{
                  padding: 20px;
                  border-radius: 22px;
                }}

                h1 {{
                  font-size: 42px;
                  margin: 12px 0;
                }}

                .sub {{
                  font-size: 15px;
                  line-height: 1.45;
                }}

                .command-grid {{
                  grid-template-columns: repeat(2, minmax(0, 1fr));
                  gap: 8px;
                  margin-top: 14px;
                }}

                .command-card {{
                  padding: 10px;
                  border-radius: 14px;
                }}

                .command-card strong {{
                  font-size: 14px;
                }}

                .toolbar {{
                  grid-template-columns: 1fr;
                  margin-top: 16px;
                }}

                .status-row {{
                  align-items: flex-start;
                  flex-direction: column;
                }}
              }}
            </style>
          </head>
          <body>
            <main>
              <section class="hero">
                <div class="meta">Generated {escape(NOW)} · Mode: {escape(run_mode)} · Model: {escape(str(run_model))}</div>
                <div class="hero-brand">
                  <span class="hero-mark" aria-hidden="true"><span>AI</span></span>
                  <span>AIbrief / <span dir="rtl" lang="ar">إحاطة</span></span>
                </div>
                <h1>AIbrief<br><span dir="rtl" lang="ar">إحاطة</span></h1>
                <p class="sub">
                  Autonomous AI Intelligence Command Platform tracking AI agents, models, GitHub, arXiv, OSINT-style signals, strategic AI developments, and provider health.
                </p>

                <div class="command-grid">
                  <div class="command-card">
                    <div class="meta">COMMAND MODE</div>
                    <strong>Sentinel Commander</strong>
                  </div>
                  <div class="{escape(x_intel_class)}">
                    <div class="meta">X INTEL</div>
                    <strong>{escape(x_intel_status)}</strong>
                  </div>
                  <div class="command-card">
                    <div class="meta">TRIAGE</div>
                    <strong>Raindrop Active</strong>
                  </div>
                  <div class="command-card">
                    <div class="meta">PROVIDER</div>
                    <strong>{escape(run_mode)}</strong>
                  </div>
                  <div class="command-card">
                    <div class="meta">SIGNALS</div>
                    <strong>{len(signals)} tracked</strong>
                  </div>
                  <div class="command-card">
                    <div class="meta">VERIFIED</div>
                    <strong>{approved} approved</strong>
                  </div>
                  <div class="command-card">
                    <div class="meta">FALLBACKS</div>
                    <strong>{PROVIDER_COUNTS["rule-based"]} rule-based</strong>
                  </div>
                </div>

                <div class="toolbar">
                  <div class="field">
                    <label for="search">Search intelligence signals</label>
                    <input id="search" type="search" placeholder="Agent, RAG, arXiv, GitHub..." autocomplete="off">
                  </div>

                  <div class="field">
                    <label for="sort">Sort signals</label>
                    <select id="sort">
                      <option value="score">Score ↓</option>
                      <option value="latest">Latest</option>
                      <option value="source">Source</option>
                    </select>
                  </div>

                  <div class="field">
                    <label for="lang">Language</label>
                    <button id="lang" type="button" aria-label="Switch briefing language to Arabic">العربية</button>
                  </div>
                </div>

                <div class="source-tabs" id="sourceTabs" aria-label="Source filters">
                  <button class="tab active" type="button" data-source="all" aria-pressed="true">All</button>
                  <button class="tab" type="button" data-source="hackernews" aria-pressed="false">HN</button>
                  <button class="tab" type="button" data-source="github" aria-pressed="false">GitHub</button>
                  <button class="tab" type="button" data-source="arxiv" aria-pressed="false">arXiv</button>
                  <button class="tab" type="button" data-source="reddit" aria-pressed="false">Reddit</button>
                  <button class="tab" type="button" data-source="twitter" aria-pressed="false">Twitter/X</button>
                  <button class="tab" type="button" data-source="youtube" aria-pressed="false">YouTube</button>
                </div>
                <p class="agent-reach-note">X influencer search requires configured X access and influencer handles. Base connectors continue normally.</p>

                <div class="topic-pills" id="topicPills"></div>
              </section>

              <div class="status-row">
                <div id="count">0 results found</div>
                <div id="countdown">Next update in 5:00</div>
              </div>

              <div class="layout">
                <section class="grid" id="grid"></section>

                <aside class="side-panel">
                  <div class="meta">AGENT HEALTH</div>
                  <h2>Operations Center</h2>
                  <div id="agents"></div>
                </aside>
              </div>
            </main>

            <script>
              const SIGNALS = {json.dumps(signals, ensure_ascii=False)};
              const AGENTS = {json.dumps(agents, ensure_ascii=False)};

              const state = {{
                search: '',
                source: 'all',
                topics: [],
                sort: 'latest',
                lang: 'en'
              }};

              function escapeHTML(value) {{
                return String(value || '')
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#039;');
              }}

              function badgeColor(score) {{
                if (score >= 70) {{
                  return '#10b981';
                }}

                if (score >= 40) {{
                  return '#f59e0b';
                }}

                return '#ef4444';
              }}

              function sourceLabel(source) {{
                const labels = {{
                  hackernews: 'HN',
                  github: 'GitHub',
                  arxiv: 'arXiv',
                  reddit: 'Reddit',
                  twitter: 'Twitter/X',
                  youtube: 'YouTube',
                  fallback: 'Fallback'
                }};

                return labels[source] || source;
              }}

              const SOURCE_FILTERS = [
                ['all', 'All'],
                ['hackernews', 'HN'],
                ['github', 'GitHub'],
                ['arxiv', 'arXiv'],
                ['reddit', 'Reddit'],
                ['twitter', 'Twitter/X'],
                ['youtube', 'YouTube']
              ];

              function sourceCounts() {{
                const counts = {{}};

                SIGNALS.forEach(function(signal) {{
                  const source = signal.source || 'unknown';
                  counts[source] = (counts[source] || 0) + 1;
                }});

                counts.all = SIGNALS.length;
                return counts;
              }}

              function cardHTML(s) {{
                const text = state.lang === 'ar' ? (s.brief_ar || s.brief_en || s.content || '') : (s.brief_en || s.content || '');
                const dir = state.lang === 'ar' ? 'rtl' : 'ltr';
                const lang = state.lang === 'ar' ? 'ar' : 'en';
                const color = badgeColor(Number(s.score || 0));

                return '' +
                  '<article class="card" dir="' + dir + '" lang="' + lang + '">' +
                    '<div class="meta">' + escapeHTML(sourceLabel(s.source)) + ' · ' + escapeHTML(s.topic) + ' · ' + escapeHTML(s.provider) + '</div>' +
                    '<h2>' + escapeHTML(s.title) + '</h2>' +
                    '<p>' + escapeHTML(text) + '</p>' +
                    '<div class="score-reason"><strong>Why this matters:</strong> ' + escapeHTML(s.score_reason || 'Matched strategic AI signal criteria.') + '</div>' +
                    '<div class="card-footer">' +
                      '<span class="badge" style="background:' + color + '">Score ' + escapeHTML(s.score) + '</span>' +
                      '<button class="copy" type="button" data-url="' + escapeHTML(s.url) + '">Copy URL</button>' +
                    '</div>' +
                    '<a href="' + escapeHTML(s.url) + '" target="_blank" rel="noopener">Open source</a>' +
                  '</article>';
              }}

              function renderTopics() {{
                const topics = Array.from(new Set(SIGNALS.map(function(s) {{
                  return s.topic || 'AI';
                }}))).sort();

                document.getElementById('topicPills').innerHTML = topics.map(function(topic) {{
                  const active = state.topics.includes(topic) ? ' active' : '';
                  const pressed = state.topics.includes(topic) ? 'true' : 'false';

                  return '<button class="pill' + active + '" type="button" aria-pressed="' + pressed + '" data-topic="' + escapeHTML(topic) + '">' + escapeHTML(topic) + '</button>';
                }}).join('');
              }}

              function renderTabs() {{
                const counts = sourceCounts();

                document.getElementById('sourceTabs').innerHTML = SOURCE_FILTERS.map(function(filter) {{
                  const source = filter[0];
                  const label = filter[1];
                  const count = counts[source] || 0;
                  const active = source === state.source ? ' active' : '';
                  const pressed = source === state.source ? 'true' : 'false';
                  const disabled = source !== 'all' && count === 0 ? ' disabled aria-disabled="true"' : '';
                  const current = source === state.source ? ' aria-current="true"' : '';

                  return '<button class="tab' + active + '" type="button" data-source="' + escapeHTML(source) + '" aria-pressed="' + pressed + '"' + current + disabled + '>' + escapeHTML(label) + ' (' + count + ')</button>';
                }}).join('');
              }}

              function renderAgents() {{
                document.getElementById('agents').innerHTML = AGENTS.map(function(agent) {{
                  return '' +
                    '<div class="agent">' +
                      '<div>' +
                        '<strong>' + escapeHTML(agent.name) + '</strong>' +
                        '<small>' + escapeHTML(agent.role) + '</small>' +
                      '</div>' +
                      '<span class="status-dot" title="' + escapeHTML(agent.status) + '"></span>' +
                    '</div>';
                }}).join('');
              }}

              function render() {{
                let filtered = SIGNALS.slice();

                if (state.search) {{
                  const q = state.search.toLowerCase();
                  filtered = filtered.filter(function(s) {{
                    return (
                      String(s.title || '') +
                      ' ' +
                      String(s.brief_en || '') +
                      ' ' +
                      String(s.brief_ar || '') +
                      ' ' +
                      String(s.topic || '') +
                      ' ' +
                      String(s.source || '') +
                      ' ' +
                      String(s.provider || '')
                    ).toLowerCase().includes(q);
                  }});
                }}

                if (state.source !== 'all') {{
                  filtered = filtered.filter(function(s) {{
                    return s.source === state.source;
                  }});
                }}

                if (state.topics.length) {{
                  filtered = filtered.filter(function(s) {{
                    return state.topics.includes(s.topic);
                  }});
                }}

                if (state.sort === 'score') {{
                  filtered.sort(function(a, b) {{
                    return Number(b.score || 0) - Number(a.score || 0);
                  }});
                }}

                if (state.sort === 'latest') {{
                  filtered.sort(function(a, b) {{
                    return String(b.sourcePublishedAt || b.updatedAt || b.createdAt || '').localeCompare(String(a.sourcePublishedAt || a.updatedAt || a.createdAt || ''));
                  }});
                }}

                if (state.sort === 'source') {{
                  filtered.sort(function(a, b) {{
                    return String(a.source || '').localeCompare(String(b.source || ''));
                  }});
                }}

                document.getElementById('grid').innerHTML =
                  filtered.length ?
                  filtered.map(cardHTML).join('') :
                  '<p class="empty">No signals match</p>';

                document.getElementById('count').textContent = filtered.length + ' results found';

                renderTabs();
                renderTopics();
              }}

              function copyToClipboard(text, button) {{
                if (navigator.clipboard && navigator.clipboard.writeText) {{
                  navigator.clipboard.writeText(text).then(function() {{
                    button.textContent = 'Copied!';
                    setTimeout(function() {{
                      button.textContent = 'Copy URL';
                    }}, 2000);
                  }}).catch(function() {{
                    fallbackCopy(text, button);
                  }});
                }} else {{
                  fallbackCopy(text, button);
                }}
              }}

              function fallbackCopy(text, button) {{
                const input = document.createElement('input');
                input.value = text;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);

                button.textContent = 'Copied!';

                setTimeout(function() {{
                  button.textContent = 'Copy URL';
                }}, 2000);
              }}

              function startCountdown() {{
                let remaining = 5 * 60;

                setInterval(function() {{
                  const minutes = Math.floor(remaining / 60);
                  const seconds = remaining % 60;

                  document.getElementById('countdown').textContent =
                    'Next update in ' + minutes + ':' + String(seconds).padStart(2, '0');

                  remaining -= 1;

                  if (remaining < 0) {{
                    remaining = 5 * 60;
                  }}
                }}, 1000);
              }}

              document.getElementById('search').addEventListener('input', function() {{
                state.search = this.value;
                render();
              }});

              document.getElementById('sort').addEventListener('change', function() {{
                state.sort = this.value;
                render();
              }});

              document.getElementById('lang').addEventListener('click', function() {{
                state.lang = state.lang === 'en' ? 'ar' : 'en';

                if (state.lang === 'ar') {{
                  this.textContent = 'English';
                  this.setAttribute('aria-label', 'Switch briefing language to English');
                }} else {{
                  this.textContent = 'العربية';
                  this.setAttribute('aria-label', 'Switch briefing language to Arabic');
                }}

                render();
              }});

              document.getElementById('sourceTabs').addEventListener('click', function(event) {{
                const btn = event.target.closest('button[data-source]');

                if (!btn) {{
                  return;
                }}

                state.source = btn.getAttribute('data-source');
                render();
              }});

              document.getElementById('topicPills').addEventListener('click', function(event) {{
                const btn = event.target.closest('button[data-topic]');

                if (!btn) {{
                  return;
                }}

                const topic = btn.getAttribute('data-topic');

                if (state.topics.includes(topic)) {{
                  state.topics = state.topics.filter(function(t) {{
                    return t !== topic;
                  }});
                }} else {{
                  state.topics.push(topic);
                }}

                render();
              }});

              document.getElementById('grid').addEventListener('click', function(event) {{
                const btn = event.target.closest('button.copy');

                if (!btn) {{
                  return;
                }}

                copyToClipboard(btn.getAttribute('data-url'), btn);
              }});

              renderAgents();
              renderTopics();
              render();
              startCountdown();
            </script>
          </body>
          </html>"""

          landing_template = Path("web/landing-template.html")
          if landing_template.exists():
              html = landing_template.read_text(encoding="utf-8")

          Path("web/index.html").write_text(html, encoding="utf-8")
          Path("web/brief.html").write_text(html, encoding="utf-8")
          PY

          python3 -m json.tool web/data/signals.json >/dev/null
          python3 -m json.tool web/data/metrics.json >/dev/null
          python3 -m json.tool web/data/runs.json >/dev/null
          python3 -m json.tool web/health.json >/dev/null
          test -s web/index.html
          test -s web/brief.html

      - name: Commit generated files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "aibrief-bot"
          git config user.email "aibrief-bot@example.com"

          git add web/index.html web/brief.html web/data/signals.json web/data/metrics.json web/data/runs.json web/health.json web/health/index.html data/latest_report.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update AIbrief feed [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after remote update..."
            sleep 5
          done

          echo "Failed to push generated files after 3 attempts"
          exit 1
