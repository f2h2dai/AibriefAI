name: Update Feed

on:
  workflow_dispatch:
    inputs:
      send_notification:
        description: "Send ntfy notification for this manual run"
        required: false
        default: "false"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-feed.yml"
      - "config/browser_router.json"
      - "scripts/check_lightpanda.py"
      - "scripts/install_lightpanda.py"
      - "data/feed_refresh_request.txt"
  schedule:
    # 8 AM America/New_York during EDT. GitHub Actions cron uses UTC.
    - cron: "0 12 * * *"
    # 2 PM America/New_York during EDT. Website-only run, no notification.
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: aibrief-feed
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AGENT_LIMIT_ID: daily_ai_brief
  LIGHTPANDA_VERSION: "0.3.6"
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: gemini-2.0-flash
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  GROQ_MODEL: llama-3.3-70b-versatile
  TWITTER_COOKIE: ${{ secrets.TWITTER_COOKIE }}
  X_INFLUENCERS: ${{ vars.X_INFLUENCERS }}

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Agent limit preflight
        shell: bash
        run: python3 scripts/check_agent_limits.py --agent "$AGENT_LIMIT_ID" --all-workflows

      - name: Cache Lightpanda
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/lightpanda/0.3.6
          key: lightpanda-${{ runner.os }}-${{ runner.arch }}-0.3.6

      - name: Install verified Lightpanda
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/install_lightpanda.py \
            --version "$LIGHTPANDA_VERSION" \
            --destination "$RUNNER_TEMP/lightpanda/$LIGHTPANDA_VERSION/lightpanda" \
            --github-env "$GITHUB_ENV"

      - name: Require Lightpanda runtime
        run: python3 scripts/check_lightpanda.py --require-binary

      - name: Install Agent-Reach and X routes
        shell: bash
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          TWITTER_CLI_SOURCE="git+https://github.com/public-clis/twitter-cli.git@7c634e0d396b1e7af9f63315b414925fe4f29ae7"
          python3 -m pip install "git+https://github.com/Panniantong/Agent-Reach.git" || echo "Agent-Reach GitHub install unavailable; continuing with base connectors"
          if command -v pipx >/dev/null 2>&1; then
            pipx install "$TWITTER_CLI_SOURCE" || python3 -m pip install "$TWITTER_CLI_SOURCE" || echo "twitter-cli install unavailable; X route will degrade"
          else
            python3 -m pip install "$TWITTER_CLI_SOURCE" || echo "twitter-cli install unavailable; X route will degrade"
          fi
          which twitter || echo "twitter CLI unavailable after install attempt"
          twitter --version || true
          agent-reach doctor || true
          set -e

      - name: Validate API Keys
        shell: bash
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "⚠️ GEMINI_API_KEY missing"
          else
            echo "✅ GEMINI_API_KEY loaded"
          fi
          if [ -z "$GROQ_API_KEY" ]; then
            echo "⚠️ GROQ_API_KEY missing"
          else
            echo "✅ GROQ_API_KEY loaded"
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Generate AIbrief command center
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: "${{ github.event.schedule || '' }}"
          SEND_NOTIFICATION: "${{ github.event.inputs.send_notification || 'false' }}"
          ACTION_SCORE_THRESHOLD: "${{ vars.ACTION_SCORE_THRESHOLD || '70' }}"
        run: |
          set -euo pipefail

          mkdir -p web/data web/health data

          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from html import escape
          from pathlib import Path

          from aibrief.agents.orchestrator import AgentOperationsOrchestrator, write_operations_artifacts
          from aibrief.breaking_monitor import (
              DEFAULT_X_PRIORITY_ACCOUNTS,
              canonical_x_post_url,
              normalize_x_record,
              source_published_timestamp,
              x_record_handle,
              x_search_queries as build_x_search_queries,
          )

          NOW_DT = datetime.now(timezone.utc)
          NOW = NOW_DT.strftime("%Y-%m-%dT%H:%M:%SZ")
          PIPELINE_STARTED = time.monotonic()
          FRESH_SOURCE_DAYS = 7
          STALE_SOURCE_DAYS = 21
          X_MAX_SOURCE_AGE_DAYS = max(1, int(os.getenv("X_MAX_SOURCE_AGE_DAYS", "7")))
          TOPIC = "AI agents"

          GEMINI_API_KEY = os.getenv("GEMINI_API_KEY", "").strip()
          GEMINI_MODEL = os.getenv("GEMINI_MODEL", "gemini-2.0-flash").strip()
          GROQ_API_KEY = os.getenv("GROQ_API_KEY", "").strip()
          GROQ_MODEL = os.getenv("GROQ_MODEL", "llama-3.3-70b-versatile").strip()
          NTFY_TOPIC = os.getenv("NTFY_TOPIC", "").strip()
          GITHUB_EVENT_NAME = os.getenv("GITHUB_EVENT_NAME", "").strip()
          GITHUB_EVENT_SCHEDULE = os.getenv("GITHUB_EVENT_SCHEDULE", "").strip()
          SEND_NOTIFICATION = os.getenv("SEND_NOTIFICATION", "false").strip()
          MORNING_CRON = "0 12 * * *"
          ACTION_SCORE_THRESHOLD = float(os.getenv("ACTION_SCORE_THRESHOLD", "70"))

          GEMINI_QUOTA_EXHAUSTED = False
          PROVIDER_COUNTS = {
              "gemini": 0,
              "groq": 0,
              "rule-based": 0
          }
          PIPELINE_EVENTS = []

          def log_event(level, agent, message):
              PIPELINE_EVENTS.append({
                  "time": NOW,
                  "level": level,
                  "agent": agent,
                  "message": str(message)[:300]
              })

          def fetch_json(url, timeout=12):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "AIbrief/1.0",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.loads(r.read().decode("utf-8", "replace"))

          def fetch_text(url, timeout=12):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "AIbrief/1.0",
                      "Accept": "application/xml,text/xml,text/plain",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read(2_000_000).decode("utf-8", "replace")

          def signal_key(signal):
              source = str(signal.get("source") or "").strip().lower()
              url = str(signal.get("url") or "").strip()
              title = re.sub(r"\s+", " ", str(signal.get("title") or "")).strip().lower()
              return source, url, title

          def load_previous_signal_keys():
              try:
                  path = Path("web/data/signals.json")
                  if not path.exists():
                      return set()
                  data = json.loads(path.read_text(encoding="utf-8"))
                  return {
                      signal_key(signal)
                      for signal in data.get("signals", [])
                      if signal_key(signal) != ("", "", "")
                  }
              except Exception as e:
                  log_event(
                      "warning",
                      "NotificationAgent",
                      f"Previous signal history unavailable: {type(e).__name__}",
                  )
                  return set()

          PREVIOUS_SIGNAL_KEYS = load_previous_signal_keys()

          def isoformat_dt(value):
              if not value:
                  return ""
              return value.astimezone(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")

          def iso_from_unix(value):
              try:
                  return isoformat_dt(datetime.fromtimestamp(int(value), timezone.utc))
              except Exception:
                  return ""

          def parse_source_datetime(value):
              if value is None:
                  return None
              if isinstance(value, (int, float)):
                  try:
                      return datetime.fromtimestamp(value, timezone.utc)
                  except Exception:
                      return None
              text = str(value).strip()
              if not text:
                  return None
              normalized = text.replace("Z", "+00:00")
              try:
                  parsed = datetime.fromisoformat(normalized)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed.astimezone(timezone.utc)
              except ValueError:
                  pass
              try:
                  parsed = parsedate_to_datetime(text)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone.utc)
                  return parsed.astimezone(timezone.utc)
              except Exception:
                  return None

          def source_timestamp(raw):
              for key in (
                  "source_published_at",
                  "published_at",
                  "publishedAt",
                  "created_at",
                  "createdAtISO",
                  "createdAt",
                  "updated_at",
                  "updatedAt",
                  "pushed_at",
              ):
                  parsed = parse_source_datetime(raw.get(key))
                  if parsed:
                      return isoformat_dt(parsed)
              return ""

          def source_age_days(source_published_at):
              parsed = parse_source_datetime(source_published_at)
              if not parsed:
                  return None
              return max(0, round((NOW_DT - parsed).total_seconds() / 86400, 2))

          def freshness_status(source_published_at):
              age = source_age_days(source_published_at)
              if age is None:
                  return "unknown"
              if age <= FRESH_SOURCE_DAYS:
                  return "fresh"
              if age <= STALE_SOURCE_DAYS:
                  return "aging"
              return "stale"

          def freshness_adjustment(source_published_at, source):
              age = source_age_days(source_published_at)
              if age is None:
                  return 0 if source in {"twitter", "fallback"} else -6
              if age <= 1:
                  return 12
              if age <= 3:
                  return 9
              if age <= FRESH_SOURCE_DAYS:
                  return 5
              if age <= STALE_SOURCE_DAYS:
                  return -8
              return -28

          def freshness_reason(source_published_at):
              age = source_age_days(source_published_at)
              if age is None:
                  return "source date unavailable"
              return f"source age {age}d"

          def freshness_rank(signal):
              age = signal.get("freshnessAgeDays")
              if isinstance(age, (int, float)):
                  if age <= 1:
                      return 4
                  if age <= 3:
                      return 3
                  if age <= FRESH_SOURCE_DAYS:
                      return 2
                  if age <= STALE_SOURCE_DAYS:
                      return 1
                  return 0
              return 1 if signal.get("source") in {"twitter", "fallback"} else 0

          def should_send_notification():
              if not NTFY_TOPIC:
                  return False, "notification topic missing"

              if GITHUB_EVENT_NAME == "workflow_dispatch":
                  if SEND_NOTIFICATION.lower() == "true":
                      return True, "manual notification enabled"
                  return False, "manual run without notification"

              if GITHUB_EVENT_NAME == "schedule" and GITHUB_EVENT_SCHEDULE == MORNING_CRON:
                  return True, "morning schedule"

              return False, "not morning run"

          def short_title(value, limit=92):
              text = re.sub(r"\s+", " ", str(value or "")).strip()
              if len(text) <= limit:
                  return text
              return text[: limit - 3].rstrip() + "..."

          def send_ntfy_digest(signals, fresh_signals):
              if not signals:
                  return False, "zero signals"

              if not fresh_signals:
                  return False, "no fresh signals"

              digest_signals = sorted(
                  fresh_signals,
                  key=lambda signal: int(signal.get("score") or 0),
                  reverse=True,
              )[:5]

              lines = [
                  f"AIbrief / إحاطة — {NOW}",
                  "",
              ]

              for signal in digest_signals:
                  source = short_title(signal.get("source") or "unknown", 28)
                  score = signal.get("score", 0)
                  title = short_title(signal.get("title"), 92)
                  lines.append(f"- {source} · score {score} · {title}")

              lines.extend(["", "Open full command center"])
              payload = "\n".join(lines).encode("utf-8")
              topic = urllib.parse.quote(NTFY_TOPIC, safe="")

              try:
                  req = urllib.request.Request(
                      f"https://ntfy.sh/{topic}",
                      data=payload,
                      method="POST",
                      headers={
                          "Title": "AIbrief Morning Brief",
                          "Priority": "default",
                          "Tags": "robot,brain",
                          "Click": "https://aibriefai.onrender.com/",
                          "Content-Type": "text/plain; charset=utf-8",
                      },
                  )

                  with urllib.request.urlopen(req, timeout=15) as response:
                      response.read(1000)

                  log_event("info", "NotificationAgent", "Morning ntfy notification sent.")
                  return True, "sent"

              except urllib.error.HTTPError as e:
                  log_event(
                      "warning",
                      "NotificationAgent",
                      f"ntfy notification failed with HTTP {e.code}",
                  )
                  return False, f"ntfy HTTP {e.code}"

              except urllib.error.URLError:
                  log_event("warning", "NotificationAgent", "ntfy notification failed with URL error.")
                  return False, "ntfy URL error"

              except Exception as e:
                  log_event(
                      "warning",
                      "NotificationAgent",
                      f"ntfy notification failed: {type(e).__name__}",
                  )
                  return False, f"ntfy {type(e).__name__}"

          X_QUERY = (
              'AI OR agents OR LLM OR GPT OR reasoning OR "Project Maven" OR "Grok Gov" '
              'OR "AI targeting" OR "military AI" OR "geospatial intelligence" '
              'OR "الذكاء الاصطناعي" OR "غروك" OR "استهداف"'
          )

          raw_cookie = os.getenv(
              "TWITTER_COOKIE", ""
          ).strip()

          auth_token = ""
          ct0 = ""

          if raw_cookie:
              for part in raw_cookie.split(";"):
                  part = part.strip()
                  if part.startswith("auth_token="):
                      auth_token = part[len("auth_token="):]
                  elif part.startswith("ct0="):
                      ct0 = part[len("ct0="):]

          if auth_token:
              os.environ["TWITTER_AUTH_TOKEN"] = auth_token
              os.environ["AUTH_TOKEN"] = auth_token
              log_event("INFO", "twitter",
                  "X access credential parsed OK")
          else:
              log_event("WARN", "twitter",
                  "X access configuration is incomplete")

          if ct0:
              os.environ["TWITTER_CT0"] = ct0
              os.environ["CT0"] = ct0
              log_event("INFO", "twitter", "X session metadata parsed OK")
          else:
              log_event("WARN", "twitter",
                  "X session metadata is incomplete")

          def safe_log_text(value, limit=260):
              text = re.sub(r"\s+", " ", str(value or "")).strip()
              cookie = os.getenv("TWITTER_COOKIE", "").strip()
              if cookie:
                  text = text.replace(cookie, "[redacted-twitter-cookie]")
              return text[:limit] + ("..." if len(text) > limit else "")

          def display_command(command):
              parts = []
              for part in command:
                  text = str(part)
                  if re.search(r"\s", text):
                      parts.append('"' + text.replace('"', '\\"') + '"')
                  else:
                      parts.append(text)
              return " ".join(parts)

          def run_cli(command, timeout=45):
              try:
                  completed = subprocess.run(
                      command,
                      capture_output=True,
                      check=False,
                      env=os.environ.copy(),
                      text=True,
                      timeout=timeout,
                  )
                  return {
                      "returncode": completed.returncode,
                      "stdout": completed.stdout or "",
                      "stderr": completed.stderr or "",
                  }
              except FileNotFoundError as e:
                  return {"returncode": 127, "stdout": "", "stderr": str(e)}
              except subprocess.TimeoutExpired as e:
                  return {
                      "returncode": 124,
                      "stdout": e.stdout or "",
                      "stderr": (e.stderr or "") + f" timed out after {timeout}s",
                  }
              except Exception as e:
                  return {"returncode": 1, "stdout": "", "stderr": f"{type(e).__name__}: {e}"}

          def log_command_failure(agent, command, result):
              log_event(
                  "warning",
                  agent,
                  f"{display_command(command)} exited {result['returncode']}. stderr: {safe_log_text(result.get('stderr')) or '(empty)'}",
              )

          def log_agent_reach_doctor():
              command = ["agent-reach", "doctor"]
              result = run_cli(command, timeout=30)
              combined = f"{result.get('stdout', '')}\n{result.get('stderr', '')}"
              route_lines = [
                  safe_log_text(line, 120)
                  for line in combined.splitlines()
                  if re.search(r"twitter|x/twitter|twitter-cli|opencli|bird", line, re.I)
              ]
              route_summary = " | ".join(route_lines[:6]) or "No Twitter/X route details emitted."
              level = "info" if result["returncode"] == 0 else "warning"
              log_event(
                  level,
                  "AgentReachDoctor",
                  f"{display_command(command)} exited {result['returncode']}. Twitter/X routes: {route_summary}. stderr: {safe_log_text(result.get('stderr')) or '(empty)'}",
              )

          def x_influencer_handles():
              raw = os.getenv("X_INFLUENCERS", "").strip()
              source = re.split(r"[\s,;]+", raw) if raw else DEFAULT_X_PRIORITY_ACCOUNTS
              handles = []
              seen = set()
              for item in source:
                  handle = re.sub(r"[^A-Za-z0-9_]", "", item.strip().removeprefix("@"))
                  key = handle.lower()
                  if handle and key not in seen:
                      seen.add(key)
                      handles.append(handle)
              max_handles = max(1, int(os.getenv("X_INFLUENCER_LIMIT", "24")))
              return handles[:max_handles]

          def parse_cli_json(stdout):
              text = (stdout or "").strip()
              if not text:
                  return None
              try:
                  return json.loads(text)
              except json.JSONDecodeError:
                  pass
              for line in reversed(text.splitlines()):
                  try:
                      return json.loads(line.strip())
                  except json.JSONDecodeError:
                      continue
              return None

          def extract_cli_records(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("results", "items", "data", "posts", "tweets"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value
                  if any(key in payload for key in ("title", "text", "content", "url", "link")):
                      return [payload]
              return []

          def first_cli_text(*values):
              for value in values:
                  if value is None:
                      continue
                  text = " ".join(str(value).split())
                  if text:
                      return text
              return ""

          def cli_record_handle(record, fallback):
              for key in ("handle", "username", "screen_name", "author_handle"):
                  value = first_cli_text(record.get(key)).removeprefix("@")
                  if value:
                      return value
              for key in ("author", "user", "account"):
                  value = record.get(key)
                  if isinstance(value, dict):
                      handle = first_cli_text(
                          value.get("handle"),
                          value.get("username"),
                          value.get("screen_name"),
                      ).removeprefix("@")
                      if handle:
                          return handle
                  else:
                      handle = first_cli_text(value).removeprefix("@")
                      if handle:
                          return handle
              return fallback

          def normalize_cli_tweet(record, fallback_handle):
              normalized = normalize_x_record(record, fallback_handle)
              if not normalized:
                  return None
              url = normalized["url"]
              published_dt = source_published_timestamp({**record, **normalized, "url": url})
              if not published_dt:
                  return None
              age = NOW_DT - published_dt
              if not timedelta(minutes=-10) <= age <= timedelta(days=X_MAX_SOURCE_AGE_DAYS):
                  return None
              content = first_cli_text(normalized.get("content"), normalized.get("title"))
              if len(content) < 40:
                  return None
              handle = x_record_handle(record, fallback_handle)
              if not handle:
                  match = re.search(r"https://x\.com/([^/]+)/status/", url, re.I)
                  handle = match.group(1) if match else "x"
              return {
                  "source": "twitter",
                  "title": f"@{handle}: {content[:140]}",
                  "content": content,
                  "url": url,
                  "collector": "XInfluencerAgent",
                  "source_published_at": isoformat_dt(published_dt),
              }

          def parse_text_tweets(stdout, handle):
              clean = re.sub(r"\x1b\[[0-9;]*m", "", stdout or "")
              blocks = re.split(r"\n\s*\n", clean)
              records = []
              for block in blocks:
                  lines = [line.strip(" \t-") for line in block.splitlines() if line.strip()]
                  if not lines:
                      continue
                  url_match = re.search(r"https?://(?:x\.com|twitter\.com)/[^\s)]+", block)
                  url = canonical_x_post_url(url_match.group(0), handle) if url_match else ""
                  if not url:
                      continue
                  text_match = re.search(
                      r"(?im)^\s*(?:text|full_text|content):\s*['\"]?(.*?)['\"]?\s*$",
                      block,
                  )
                  content = first_cli_text(text_match.group(1) if text_match else "")
                  if not content:
                      content_lines = [
                          line
                          for line in lines
                          if not line.lower().startswith(
                              (
                                  "warning", "error", "usage", "ok:", "schema_version:",
                                  "data:", "id:", "author:", "url:", "createdat",
                                  "likecount:", "replycount:", "retweetcount:",
                              )
                          )
                          and "https://x.com/" not in line
                          and "https://twitter.com/" not in line
                      ]
                      content = " ".join(content_lines)
                  if len(content) < 8:
                      continue
                  normalized = normalize_cli_tweet({"text": content, "url": url}, handle)
                  if normalized:
                      records.append(normalized)
              return records

          def parse_twitter_cli_output(stdout, handle):
              payload = parse_cli_json(stdout)
              if payload is not None:
                  records = []
                  for record in extract_cli_records(payload):
                      if isinstance(record, dict):
                          normalized = normalize_cli_tweet(record, handle)
                          if normalized:
                              records.append(normalized)
                  return records
              return parse_text_tweets(stdout, handle)

          def x_search_commands(query):
              return [
                  ["twitter", "search", query, "--json", "--max", "20", "--full-text"],
                  ["opencli", "twitter", "search", query],
                  ["bird", "search", query],
              ]

          def x_tweet_commands(url):
              return [
                  ["twitter", "tweet", url],
                  ["opencli", "twitter", "tweet", url],
                  ["bird", "tweet", url],
              ]

          def enrich_x_tweet(record):
              url = canonical_x_post_url(record.get("url", ""))
              record["url"] = url
              if not url.startswith(("https://x.com/", "https://twitter.com/")):
                  return record
              for command in x_tweet_commands(url):
                  result = run_cli(command, timeout=30)
                  if result["returncode"] != 0:
                      log_command_failure("XInfluencerAgent", command, result)
                      continue
                  parsed = parse_twitter_cli_output(result.get("stdout", ""), "")
                  if parsed:
                      enriched = parsed[0]
                      enriched["url"] = url
                      return enriched
              return record

          def fetch_x_influencers_cli(limit=20):
              collected = []
              seen_urls = set()
              since_date = (NOW_DT - timedelta(days=X_MAX_SOURCE_AGE_DAYS)).strftime("%Y-%m-%d")
              queries = [
                  f"{query} since:{since_date}"
                  for query in build_x_search_queries(os.environ)
              ]
              for query in queries:
                  handle_matches = re.findall(r"from:([A-Za-z0-9_]+)", query)
                  handle = handle_matches[0] if len(handle_matches) == 1 else ""
                  parsed = []
                  for command in x_search_commands(query):
                      result = run_cli(command, timeout=45)
                      if result["returncode"] != 0:
                          log_command_failure("XInfluencerAgent", command, result)
                          continue
                      parsed = parse_twitter_cli_output(result.get("stdout", ""), handle)
                      if parsed:
                          log_event("info", "XInfluencerAgent", f"{display_command(command)} exited 0. Parsed {len(parsed)} X records.")
                          break
                      log_event("warning", "XInfluencerAgent", f"{display_command(command)} exited 0 but produced no parseable X records.")

                  for record in parsed:
                      if len(collected) >= limit:
                          break
                      if record["url"] in seen_urls:
                          continue
                      seen_urls.add(record["url"])
                      collected.append(record)
                  if len(collected) >= limit:
                      break

              return collected[:limit]

          def score_text(title, content, source):
              text = f"{title} {content}".lower()

              weights = {
                  "agent": 14,
                  "agents": 14,
                  "ai": 10,
                  "llm": 10,
                  "gemini": 12,
                  "groq": 10,
                  "rag": 9,
                  "workflow": 8,
                  "automation": 8,
                  "open source": 8,
                  "github": 7,
                  "research": 7,
                  "military": 12,
                  "defense": 12,
                  "drone": 12,
                  "surveillance": 10,
                  "osint": 10,
                  "geopolitics": 9,
                  "infrastructure": 8,
              }

              score = {
                  "hackernews": 25,
                  "github": 22,
                  "arxiv": 30,
                  "reddit": 18,
                  "twitter": 28,
                  "youtube": 18,
                  "fallback": 20,
              }.get(source, 15)

              for term, weight in weights.items():
                  if re.search(rf"\b{re.escape(term)}\b", text):
                      score += weight

              return max(0, min(100, score))

          def topic_for(title, content):
              text = f"{title} {content}".lower()

              if "military" in text or "defense" in text or "drone" in text or "warfare" in text:
                  return "AI Warfare"
              if "agent" in text:
                  return "AI Agents"
              if "rag" in text or "retrieval" in text:
                  return "RAG"
              if "model" in text or "llm" in text:
                  return "LLMs"
              if "github" in text or "open source" in text:
                  return "Open Source"
              if "government" in text or "policy" in text:
                  return "AI Governance"

              return "AI"

          def score_reason(title, content, source, score):
              text = f"{title} {content}".lower()
              reasons = []

              source_labels = {
                  "github": "high-value open-source ecosystem signal",
                  "arxiv": "academic/research signal",
                  "hackernews": "live technology discussion signal",
                  "reddit": "community narrative signal",
                  "twitter": "Twitter/X discussion signal",
                  "youtube": "video/tutorial signal",
                  "fallback": "system fallback signal"
              }

              reasons.append(source_labels.get(source, "monitored AI source"))

              checks = [
                  ("agent", "agentic AI relevance"),
                  ("rag", "retrieval/RAG relevance"),
                  ("llm", "large language model relevance"),
                  ("model", "model capability relevance"),
                  ("github", "implementation ecosystem relevance"),
                  ("research", "research relevance"),
                  ("military", "strategic/security relevance"),
                  ("defense", "strategic/security relevance"),
                  ("drone", "autonomous systems relevance"),
                  ("osint", "OSINT relevance"),
                  ("surveillance", "surveillance relevance"),
                  ("infrastructure", "AI infrastructure relevance")
              ]

              for keyword, reason in checks:
                  if keyword in text and reason not in reasons:
                      reasons.append(reason)

              return "; ".join(reasons[:4]) + f". Final score: {score}."

          def summarize_rule(title, content):
              c = re.sub(r"\s+", " ", content or "").strip()

              if not c:
                  return f"{title} is relevant to AI operators tracking technical signals."

              return c[:240] + ("..." if len(c) > 240 else "")

          def summarize_rule_ar(title, content):
              en = summarize_rule(title, content)
              return "ملخص قائم على القواعد: " + en

          def parse_llm_json(text, rule_summary):
              text = text.strip()
              text = text.removeprefix("```json").removeprefix("```").removesuffix("```").strip()
              parsed = json.loads(text)

              return (
                  parsed.get("en") or rule_summary,
                  parsed.get("ar") or "لم يتم إرجاع ملخص عربي من النموذج."
              )

          def llm_brief(title, content):
              global GEMINI_QUOTA_EXHAUSTED
              global PROVIDER_COUNTS

              rule_summary = summarize_rule(title, content)
              rule_summary_ar = summarize_rule_ar(title, content)

              prompt = (
                  "Create a concise bilingual AI intelligence brief.\n"
                  "Return JSON only with keys: en, ar.\n"
                  "Style: factual, concise, OSINT-oriented, strategic, professional Arabic.\n"
                  "Do not exaggerate claims. Preserve uncertainty.\n"
                  f"Title: {title}\n"
                  f"Content: {content[:1500]}\n"
              )

              if GEMINI_API_KEY and not GEMINI_QUOTA_EXHAUSTED:
                  payload = json.dumps({
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {
                          "temperature": 0.2,
                          "maxOutputTokens": 512
                      }
                  }).encode("utf-8")

                  url = (
                      "https://generativelanguage.googleapis.com/v1beta/models/"
                      + urllib.parse.quote(GEMINI_MODEL)
                      + ":generateContent?key="
                      + urllib.parse.quote(GEMINI_API_KEY)
                  )

                  try:
                      req = urllib.request.Request(
                          url,
                          data=payload,
                          method="POST",
                          headers={"Content-Type": "application/json"},
                      )

                      with urllib.request.urlopen(req, timeout=25) as r:
                          data = json.loads(r.read().decode("utf-8", "replace"))

                      text = data["candidates"][0]["content"]["parts"][0]["text"]
                      en, ar = parse_llm_json(text, rule_summary)
                      PROVIDER_COUNTS["gemini"] += 1
                      return en, ar, "gemini"

                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      err = f"Gemini HTTP {e.code}: {body[:300]}"
                      if e.code == 429:
                          GEMINI_QUOTA_EXHAUSTED = True
                      log_event("warning", "GeminiRouter", err)

                  except urllib.error.URLError as e:
                      err = f"Gemini URLError: {e.reason}"
                      log_event("warning", "GeminiRouter", err)

                  except Exception as e:
                      err = f"Gemini {type(e).__name__}: {str(e)}"
                      log_event("warning", "GeminiRouter", err)

              if GROQ_API_KEY:
                  payload = json.dumps({
                      "model": GROQ_MODEL,
                      "messages": [
                          {
                              "role": "system",
                              "content": "Return JSON only with keys en and ar."
                          },
                          {
                              "role": "user",
                              "content": prompt
                          }
                      ],
                      "temperature": 0.2,
                      "max_tokens": 512
                  }).encode("utf-8")

                  try:
                      req = urllib.request.Request(
                          "https://api.groq.com/openai/v1/chat/completions",
                          data=payload,
                          method="POST",
                          headers={
                              "Accept": "application/json",
                              "Content-Type": "application/json",
                              "User-Agent": "AIbrief-GitHubActions/1.0",
                              "Authorization": "Bearer " + GROQ_API_KEY
                          },
                      )

                      with urllib.request.urlopen(req, timeout=25) as r:
                          data = json.loads(r.read().decode("utf-8", "replace"))

                      text = data["choices"][0]["message"]["content"]
                      en, ar = parse_llm_json(text, rule_summary)
                      PROVIDER_COUNTS["groq"] += 1
                      return en, ar, "groq"

                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", "replace")
                      log_event("error", "GroqRouter", f"Groq HTTP {e.code}: {body[:200]}")

                  except urllib.error.URLError as e:
                      log_event("error", "GroqRouter", f"Groq URL error: {e.reason}")

                  except Exception as e:
                      log_event("error", "GroqRouter", f"Groq error: {type(e).__name__}: {e}")

              PROVIDER_COUNTS["rule-based"] += 1
              log_event("info", "RaindropTriageAgent", "Rule-based fallback used for one signal.")
              return rule_summary, rule_summary_ar, "rule-based"

          items = []

          try:
              ids = fetch_json("https://hacker-news.firebaseio.com/v0/topstories.json")[:25]

              for sid in ids[:10]:
                  try:
                      item = fetch_json(f"https://hacker-news.firebaseio.com/v0/item/{sid}.json")
                      title = item.get("title") or ""
                      url = item.get("url") or f"https://news.ycombinator.com/item?id={sid}"
                      content = title

                      if re.search(r"ai|agent|llm|gemini|openai|rag|github|model|defense|drone|osint", title, re.I):
                          items.append({
                              "source": "hackernews",
                              "title": title,
                              "content": content,
                              "url": url,
                              "collector": "NewsAgent",
                              "source_published_at": iso_from_unix(item.get("time")),
                          })
                  except Exception as e:
                      log_event("warning", "NewsAgent", e)
          except Exception as e:
              log_event("error", "NewsAgent", e)

          try:
              curated_github_repos = [
                  {
                      "full_name": "cheahjs/free-llm-api-resources",
                      "html_url": "https://github.com/cheahjs/free-llm-api-resources",
                      "description": (
                          "Curated list of permanently free LLM inference APIs, including Google AI Studio, "
                          "Groq, Cerebras, OpenRouter, NVIDIA NIM, and Mistral, with rate-limit notes and "
                          "OpenAI SDK compatibility."
                      ),
                  }
              ]

              curated_names = {repo["full_name"].lower() for repo in curated_github_repos}

              for curated in curated_github_repos:
                  repo = dict(curated)
                  try:
                      live_repo = fetch_json(f"https://api.github.com/repos/{curated['full_name']}")
                      repo["description"] = live_repo.get("description") or repo["description"]
                      repo["stargazers_count"] = live_repo.get("stargazers_count")
                      repo["updated_at"] = live_repo.get("updated_at")
                      repo["pushed_at"] = live_repo.get("pushed_at")
                  except Exception as e:
